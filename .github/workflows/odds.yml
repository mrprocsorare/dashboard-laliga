name: actualizar-cuotas

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cache de node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependencias
        run: npm ci --prefer-offline --no-audit

      - name: Comprobar configuración
        id: config
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cuotas omitidas: falta el secreto ODDS_API_KEY. Las alineaciones funcionan en otro workflow." 
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Actualizar cuotas The Odds API
        if: steps.config.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run odds

      - name: Resumen cuando no hay key
        if: steps.config.outputs.configured != 'true'
        run: |
          {
            echo "## Cuotas omitidas"
            echo ""
            echo "Falta el secreto \\`ODDS_API_KEY\\`. El scraping de alineaciones está separado y no se ve afectado."
            echo "Añade el secreto en Settings > Secrets and variables > Actions para activar las cuotas."
          } >> "$GITHUB_STEP_SUMMARY"
