name: sincronizar-sorare

on:
  schedule:
    - cron: "25 4 * * *"
  workflow_dispatch:

concurrency:
  group: sorare-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cache de node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependencias
        run: npm ci --prefer-offline --no-audit

      - name: Sincronizar una vez al día
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          SORARE_REQUEST_BUDGET: 100
          SORARE_REQUESTS_PER_MINUTE: 30
        run: npm run sync:sorare -- --apply
